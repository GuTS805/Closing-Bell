[package]
name = "closing-bell-guard"
version = "0.1.0"
description = "Oracle-banded execution guard for tokenized equities"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "closing_bell_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
pyth-solana-receiver-sdk = "2.0.0"
solana-program = "5.0.0"
